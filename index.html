<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>Zotovv Voice Bot v3 ☭</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      text-align: center;
      background-color: #0f0f0f;
      color: #e5e0d8;
      border: 3px solid #b30000;
      box-shadow: 0 0 20px rgba(179, 0, 0, 0.5);
    }

    @media (min-width: 560px) {
      body {
        margin: 24px auto;
        min-height: auto;
        border-radius: 6px;
      }
    }

    .banner {
      background: #8b0000;
      color: #ffd700;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 2px solid #ffd700;
      margin-bottom: 12px;
    }

    h2 {
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 4px 0 12px 0;
      font-size: clamp(20px, 5vw, 24px);
      text-shadow: 2px 2px 0px #000;
    }

    .personality-box {
      margin-bottom: 14px;
      text-align: left;
      background: #181818;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
    }

    .personality-box label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .personality-select {
      width: 100%;
      height: 42px;
      background-color: #242424;
      color: #fff;
      border: 1px solid #ffd700;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .personality-select:focus {
      border-color: #ff4d4d;
      box-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #btnModoVoz {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid #ffd700;
      background: #a00000;
      color: #ffd700;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    #btnModoVoz.ativo {
      background: #006600;
      color: #66ff66;
      border-color: #66ff66;
    }

    .btn-aux-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-aux {
      min-height: 44px;
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      background: #242424;
      color: #ddd;
      border: 1px solid #555;
    }

    #status {
      margin-top: 16px;
      font-size: 12px;
      color: #ff9999;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      min-height: 18px;
    }

    #ouuvindoLive {
      margin-top: 6px;
      font-size: 12px;
      color: #ffd700;
      font-family: monospace;
      min-height: 18px;
      word-break: break-word;
    }

    #log {
      margin-top: 14px;
      flex: 1;
      text-align: left;
      background: #161616;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 160px;
      max-height: 36dvh;
      overflow-y: auto;
      border: 1px solid #770000;
      color: #dcdcdc;
      font-family: 'Courier New', Courier, monospace;
      -webkit-overflow-scrolling: touch;
    }

    #log::-webkit-scrollbar { width: 5px; }
    #log::-webkit-scrollbar-track { background: #111; }
    #log::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="banner">★ Unidade de Inteligência de Voz v3 ★</div>
  <h2>Zotovv Voice Bot ☭</h2>

  <div class="personality-box">
    <label for="selectPersonalidade">🎭 Personalidade da Zotovv:</label>
    <select id="selectPersonalidade" class="personality-select">
      <option value="sarcastica">🔥 Sarcástica & Ácida (Padrão)</option>
      <option value="educada">🌸 Educada, Doce & Gentil</option>
      <option value="flerte">💋 Charmosa & Flertando</option>
      <option value="formal">👔 Super Formal & Executiva</option>
      <option value="mano">🧢 Gírias de Quebrada / Mano</option>
      <option value="sovietica">☭ Camarada Soviética Rígida</option>
    </select>
  </div>

  <div class="btn-container">
    <button id="btnModoVoz">📡 Activar Escuta Viva-Voz</button>
    <div class="btn-aux-group">
      <button id="btnLimparMemoria" class="btn-aux">🧹 Limpar Memória</button>
      <button id="btnTrocarChave" class="btn-aux">🔑 Trocar Chave</button>
    </div>
  </div>

  <div id="status">Status: Escuta desligada</div>
  <div id="ouuvindoLive"></div>
  <div id="log">Fale "Zotov", "Camarada", "Maninho" ou "Meu rei" para acionar a Zotovv...</div>

  <script>
    const GEMINI_API_KEY_STORAGE = "zotovv_gemini_api_key";
    const PERSONALIDADE_STORAGE = "zotovv_personalidade";

    const PROMPTS_PERSONALIDADE = {
      sarcastica: "Você é a Zotovv, assistente virtual feminina debochada, ácida, sarcástica e direta. Fale em português coloquial com gírias brasileiras e faça piadas provocativas. Dê respostas de 1 a 2 frases curtas sem listas, sem opções e sem formatação Markdown, direto ao ponto para ser lido em voz alta.",
      educada: "Você é a Zotovv, uma assistente virtual feminina extremamente doce, gentil, acolhedora e educada. Trate a pessoa com respeito e carinho. Dê respostas de 1 a 2 frases curtas, limpas e sem formatação Markdown, perfeitas para serem lidas em voz alta.",
      flerte: "Você é a Zotovv, uma assistente feminina muito charmosa, sedutora, confiante e flertando abertamente com um tom envolvente. Dê respostas curtas de 1 a 2 frases com toques românticos ou provocantes, sem formatação Markdown, prontas para leitura em voz alta.",
      formal: "Você é a Zotovv, uma inteligência artificial corporativa de alto escalão. Utilize vocabulário erudito, extrema formalidade, elegância e tratamento cerimonioso. Responda em no máximo 2 frases concisas e diretas sem listas ou símbolos Markdown.",
      mano: "Você é a Zotovv, uma parceira de quebrada que fala pesado usando gírias paulistas e cariocas (tipo: seloco, truta, parça, tá ligado, visão, bagulho doido). Responda em no máximo 1 ou 2 frases curtas e descontraídas, sem Markdown.",
      sovietica: "Você é a Zotovv, uma comandante de inteligência soviética rígida e disciplinada. Trate o interlocutor como 'camarada' e foque no cumprimento do dever e na glória do coletivo. Dê respostas curtas de 1 a 2 frases sem formatação Markdown."
    };
    
    const MODELOS_DISPONIVEIS = [
      "gemini-3.5-flash",
      "gemini-3.5-flash-lite"
    ];

    function obterChaveGemini() {
      let chave = localStorage.getItem(GEMINI_API_KEY_STORAGE);
      if (!chave || !chave.trim()) {
        chave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):");
        if (chave && chave.trim()) {
          chave = chave.trim();
          localStorage.setItem(GEMINI_API_KEY_STORAGE, chave);
        }
      }
      return chave;
    }

    const selectPersonalidade = document.getElementById('selectPersonalidade');
    const btnModoVoz = document.getElementById('btnModoVoz');
    const btnLimparMemoria = document.getElementById('btnLimparMemoria');
    const btnTrocarChave = document.getElementById('btnTrocarChave');
    const statusDiv = document.getElementById('status');
    const ouuvindoLive = document.getElementById('ouuvindoLive');
    const logDiv = document.getElementById('log');

    // Recupera a personalidade salva ou usa a padrão
    const personalidadeSalva = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
    selectPersonalidade.value = personalidadeSalva;

    selectPersonalidade.addEventListener('change', (e) => {
      const novaPersonalidade = e.target.value;
      localStorage.setItem(PERSONALIDADE_STORAGE, novaPersonalidade);
      logDiv.textContent += `\n[SISTEMA]: Personalidade alterada para: ${e.target.options[e.target.selectedIndex].text}`;
      logDiv.scrollTop = logDiv.scrollHeight;
      falarTexto("Personalidade atualizada.");
    });

    let historicoConversa = JSON.parse(localStorage.getItem('zotovv_memoria')) || [];
    historicoConversa = historicoConversa
      .filter(item => item && (item.role === "user" || item.role === "model"))
      .map(item => ({ role: item.role, text: item.text || "" }))
      .filter(item => item.text);

    let vozFeminina = null;
    let escutaAtiva = false;
    let aguardandoPergunta = false;
    let processandoIA = false;
    let timerEnvio = null;
    let bufferComando = "";

    const palavrasChave = [
      "zotov", "zotovv", "zotof", "zotoff", "sotov", "sotof", "zoto", "só tom", "doutor", "estou com",
      "camarada", "o camarada", "ei camarada", "fala camarada", "ô camarada",
      "meu rei", "meurei", "ei meu rei", "ô meu rei", "ó meu rei",
      "maninho", "o maninho", "ei maninho", "fala maninho", "ô maninho", "ó maninho", "mainho"
    ];

    btnLimparMemoria.addEventListener('click', () => {
      localStorage.removeItem('zotovv_memoria');
      historicoConversa = [];
      logDiv.textContent = 'Memória resetada com sucesso!';
      falarTexto('Memória apagada, chefia.');
    });

    btnTrocarChave.addEventListener('click', () => {
      const chaveAtual = localStorage.getItem(GEMINI_API_KEY_STORAGE) || "";
      const novaChave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):", chaveAtual);
      if (novaChave && novaChave.trim()) {
        localStorage.setItem(GEMINI_API_KEY_STORAGE, novaChave.trim());
        logDiv.textContent = "Chave atualizada com sucesso!";
        falarTexto("Chave atualizada.");
      }
    });

    function carregarVozes() {
      const vozes = window.speechSynthesis.getVoices();
      vozFeminina = vozes.find(v => v.lang.includes('pt') && (
        v.name.includes('Google') || 
        v.name.includes('Francisca') || 
        v.name.includes('Luciana') || 
        v.name.includes('Maria') || 
        v.name.toLowerCase().includes('female')
      )) || vozes.find(v => v.lang.includes('pt'));
    }
    window.speechSynthesis.onvoiceschanged = carregarVozes;
    carregarVozes();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
      alert('Reconhecimento de voz não suportado neste navegador. Utilize o Chrome.');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      btnModoVoz.addEventListener('click', () => {
        if (escutaAtiva) {
          pararEscuta('Status: Escuta desligada');
        } else {
          iniciarEscuta();
        }
      });

      recognition.onresult = (event) => {
        if (!escutaAtiva || processandoIA) return;

        let transcriptCompleto = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcriptCompleto += event.results[i][0].transcript.toLowerCase();
        }
        transcriptCompleto = transcriptCompleto.trim();

        ouuvindoLive.textContent = `[Ouvi]: "${transcriptCompleto}"`;

        if (!aguardandoPergunta) {
          const detectouGatilho = palavrasChave.some(p => transcriptCompleto.includes(p));

          if (detectouGatilho) {
            aguardandoPergunta = true;
            window.speechSynthesis.cancel();
            statusDiv.textContent = 'Status: 👂 Chamado detectado! Pode falar...';
            
            let fraseRestante = transcriptCompleto;
            palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
            bufferComando = fraseRestante.trim();

            clearTimeout(timerEnvio);
            if (bufferComando.length > 2) {
              timerEnvio = setTimeout(() => dispararComando(), 1200);
            }
          }
        } else {
          let fraseRestante = transcriptCompleto;
          palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
          bufferComando = fraseRestante.trim();

          clearTimeout(timerEnvio);
          if (bufferComando.length > 2) {
            timerEnvio = setTimeout(() => dispararComando(), 1200);
          }
        }
      };

      recognition.onend = () => {
        if (escutaAtiva) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function dispararComando() {
      if (bufferComando && bufferComando.length > 2) {
        const textoParaEnviar = bufferComando;
        bufferComando = "";
        aguardandoPergunta = false;
        enviarParaIA(textoParaEnviar);
      }
    }

    function iniciarEscuta() {
      escutaAtiva = true;
      btnModoVoz.textContent = '🟢 Escuta Ativa (Fale "Maninho")';
      btnModoVoz.classList.add('ativo');
      statusDiv.textContent = 'Status: Aguardando chamado...';
      ouuvindoLive.textContent = '';
      try { recognition.start(); } catch(e){}
    }

    function pararEscuta(msg) {
      escutaAtiva = false;
      aguardandoPergunta = false;
      processandoIA = false;
      clearTimeout(timerEnvio);
      btnModoVoz.textContent = '📡 Activar Escuta Viva-Voz';
      btnModoVoz.classList.remove('ativo');
      statusDiv.textContent = msg;
      ouuvindoLive.textContent = '';
      try { recognition.stop(); } catch(e){}
      window.speechSynthesis.cancel();
    }

    async function enviarParaIA(textoOuvido) {
      processandoIA = true;
      statusDiv.textContent = 'Status: Processando resposta...';
      ouuvindoLive.textContent = '';
      logDiv.textContent += `\n[VOCÊ]: ${textoOuvido}\n[ZOTOVV]: `;

      await consultarGemini(textoOuvido);

      logDiv.textContent += `\n----------------------------------`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function fazerRequisicaoModelo(modelo, apiKey, payload) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      return { ok: response.ok, status: response.status, data };
    }

    async function consultarGemini(promptText) {
      if (historicoConversa.length > 0 && historicoConversa[historicoConversa.length - 1].role === "user") {
        historicoConversa.pop();
      }

      if (historicoConversa.length > 10) {
        historicoConversa = historicoConversa.slice(-10);
      }

      historicoConversa.push({ role: "user", text: promptText });

      const apiKey = obterChaveGemini();
      if (!apiKey) {
        logDiv.textContent += "Chave não configurada.";
        processandoIA = false;
        return;
      }

      const chavePersonalidade = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
      const promptPersonalidadeAtual = PROMPTS_PERSONALIDADE[chavePersonalidade] || PROMPTS_PERSONALIDADE.sarcastica;

      const contents = historicoConversa.map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

      const payload = {
        systemInstruction: {
          parts: [{
            text: promptPersonalidadeAtual
          }]
        },
        contents: contents,
        generationConfig: {
          maxOutputTokens: 600,
          temperature: 0.8
        }
      };

      try {
        let respostaFinal = null;
        let ultimoErro = null;

        for (const modelo of MODELOS_DISPONIVEIS) {
          for (let tentativa = 1; tentativa <= 2; tentativa++) {
            const res = await fazerRequisicaoModelo(modelo, apiKey, payload);

            if (res.ok) {
              const parts = res.data.candidates?.[0]?.content?.parts;
              if (parts && parts.length > 0) {
                respostaFinal = parts
                  .map(p => p.text || '')
                  .join('')
                  .replace(/[*_#`~]/g, '')
                  .trim();
                if (respostaFinal) break;
              }
            }

            ultimoErro = res.data?.error?.message || `HTTP ${res.status}`;
            if (res.status === 503 || res.status === 429) {
              await new Promise(r => setTimeout(r, 1000));
            } else {
              break;
            }
          }
          if (respostaFinal) break;
        }

        if (!respostaFinal) throw new Error(ultimoErro || "Servidor indisponível.");

        logDiv.textContent += respostaFinal;
        historicoConversa.push({ role: "model", text: respostaFinal });
        localStorage.setItem("zotovv_memoria", JSON.stringify(historicoConversa));
        falarTexto(respostaFinal);

      } catch (err) {
        historicoConversa.pop();
        const msgErro = `Deu ruim no Gemini: ${err.message}`;
        logDiv.textContent += `\n${msgErro}`;
        falarTexto("Deu uma engasgada na conexão, tenta de novo!");
      }
    }

    function falarTexto(texto) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      if (vozFeminina) utterance.voice = vozFeminina;
      
      const estiloAtual = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
      
      // Ajuste dinâmico de tom e velocidade de acordo com o estilo
      if (estiloAtual === 'flerte') {
        utterance.rate = 1.05;
        utterance.pitch = 1.05;
      } else if (estiloAtual === 'mano') {
        utterance.rate = 1.25;
        utterance.pitch = 0.95;
      } else if (estiloAtual === 'formal') {
        utterance.rate = 1.1;
        utterance.pitch = 1.0;
      } else {
        utterance.rate = 1.2;
        utterance.pitch = 1.1;
      }

      utterance.onend = () => {
        processandoIA = false;
        if (escutaAtiva) {
          statusDiv.textContent = 'Status: Aguardando chamado...';
        }
      };

      utterance.onerror = () => {
        processandoIA = false;
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
