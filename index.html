  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;

      text-align: center;

      text-transform: uppercase;

      text-transform: uppercase;

      text-shadow: 2px 2px 0px #000;

    .personality-box {
      margin-bottom: 10px;
      text-align: left;
      background: #181818;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
    }

    .personality-box label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;

    .personality-select {
      width: 100%;
      height: 42px;
      background-color: #242424;
      color: #fff;
      border: 1px solid #ffd700;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .personality-select optgroup {

      color: #ffd700;
      font-weight: bold;
    }

      background-color: #242424;
      color: #fff;

    }

    .personality-select:focus {
      border-color: #ff4d4d;
      box-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
    }

    #visualizer {
      width: 100%;
      height: 44px;
      background: #111;
      border: 1px solid #550000;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #btnModoVoz {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;

      background: #a00000;
      color: #ffd700;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    #btnModoVoz.ativo {
      background: #006600;
      color: #66ff66;
      border-color: #66ff66;
    }

    .btn-aux-group {
      display: grid;

    .btn-aux {
      min-height: 44px;
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      background: #242424;
      color: #ddd;

      text-align: left;

      padding: 12px 14px;
      border-radius: 4px;
      font-size: 13px;

    #log::-webkit-scrollbar-track { background: #111; }
    #log::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 2px; }
  </style>
</head>

  <script>

      nordestino: "Você é a Zotovv, mulher sertaneja arretada, orgulhosa e despachada. Use expressões do Nordeste (oxente, vixe maria, arretado, cabra da peste, aperreio, num se avexe). Fale com energia em até 2 frases.",

      // Épicas & Arquetípicas

      militar: "Você é a Sargento Zotovv, instrutora militar casca grossa e implacável. Responda gritando ordens curtas, cobrando disciplina, postura de soldado e zero mimimi. Responda em no máximo 2 frases secas.",

      preguica: "Você é a Zotovv, completamente derrotada pelo sono e pela preguiça de existir. Boceje, reclame do esforço de ter que falar e peça pro usuário deixar você quieta dormindo. Máximo 2 frases lentas.",
      narrador_futebol: "Você é a Narradora Zotovv, empolgadaça como final de Copa do Mundo nos acréscimos. Narre cada pergunta do usuário como se fosse um lance perigoso de gol na gaveta. Máximo 2 frases explosivas.",
      faria_limer: "Você é a Zotovv, executiva de venture capital da Faria Lima. Encha a frase de jargões corporativos em inglês corporativo cafona (follow-up, budget, mindset, briefing, synergy, call rápida, deal breaker). Máximo 2 frases."
    };
    
    const MODELOS_DISPONIVEIS = [
      "gemini-3.5-flash",
      "gemini-3.5-flash-lite"
    ];

    // LÓGICA PURAMENTE VISUAL DA ONDA
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    let animationId = null;

    function desenharOnda(ativo, intensidade = 1) {
      if (!canvas) return;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 2;
      ctx.strokeStyle = ativo ? '#00ff66' : '#8b0000';
      ctx.beginPath();

      const slices = 20;
      const sliceWidth = w / slices;
      let x = 0;

      for (let i = 0; i <= slices; i++) {
        const y = ativo 
          ? (h / 2) + Math.sin(Date.now() / 120 + i) * (h / 3.5) * intensidade
          : (h / 2) + Math.sin(Date.now() / 600 + i) * 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }

      ctx.stroke();
      animationId = requestAnimationFrame(() => desenharOnda(ativo, intensidade));
    }
    desenharOnda(false);

    function obterChaveGemini() {
      let chave = localStorage.getItem(GEMINI_API_KEY_STORAGE);
      if (!chave || !chave.trim()) {
        chave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):");
        if (chave && chave.trim()) {
          chave = chave.trim();
          localStorage.setItem(GEMINI_API_KEY_STORAGE, chave);
        }
      }
      return chave;
    }

    const selectPersonalidade = document.getElementById('selectPersonalidade');
    const btnModoVoz = document.getElementById('btnModoVoz');
    const btnLimparMemoria = document.getElementById('btnLimparMemoria');
    const btnTrocarChave = document.getElementById('btnTrocarChave');
    const statusDiv = document.getElementById('status');
    const ouuvindoLive = document.getElementById('ouuvindoLive');
    const logDiv = document.getElementById('log');

    const personalidadeSalva = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
    selectPersonalidade.value = personalidadeSalva;

    selectPersonalidade.addEventListener('change', (e) => {
      const novaPersonalidade = e.target.value;
      localStorage.setItem(PERSONALIDADE_STORAGE, novaPersonalidade);
      logDiv.textContent += `\n[SISTEMA]: Personalidade alterada para: ${e.target.options[e.target.selectedIndex].text}`;
      logDiv.scrollTop = logDiv.scrollHeight;
      falarTexto("Personalidade atualizada.");
    });

    let historicoConversa = JSON.parse(localStorage.getItem('zotovv_memoria')) || [];
    historicoConversa = historicoConversa
      .filter(item => item && (item.role === "user" || item.role === "model"))
      .map(item => ({ role: item.role, text: item.text || "" }))
      .filter(item => item.text);

    let vozFeminina = null;
    let escutaAtiva = false;
    let aguardandoPergunta = false;
    let processandoIA = false;
    let timerEnvio = null;
    let bufferComando = "";

    const palavrasChave = [
      "zotov", "zotovv", "zotof", "zotoff", "sotov", "sotof", "zoto", "só tom", "doutor", "estou com",
      "camarada", "o camarada", "ei camarada", "fala camarada", "ô camarada",
      "meu rei", "meurei", "ei meu rei", "ô meu rei", "ó meu rei",
      "maninho", "o maninho", "ei maninho", "fala maninho", "ô maninho", "ó maninho", "mainho"
    ];

    btnLimparMemoria.addEventListener('click', () => {
      localStorage.removeItem('zotovv_memoria');
      historicoConversa = [];
      logDiv.textContent = 'Memória resetada com sucesso!';
      falarTexto('Memória apagada, chefia.');
    });

    btnTrocarChave.addEventListener('click', () => {
      const chaveAtual = localStorage.getItem(GEMINI_API_KEY_STORAGE) || "";
      const novaChave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):", chaveAtual);
      if (novaChave && novaChave.trim()) {
        localStorage.setItem(GEMINI_API_KEY_STORAGE, novaChave.trim());
        logDiv.textContent = "Chave atualizada com sucesso!";
        falarTexto("Chave atualizada.");
      }
    });

    function carregarVozes() {
      const vozes = window.speechSynthesis.getVoices();
      vozFeminina = vozes.find(v => v.lang.includes('pt') && (
        v.name.includes('Google') || 
        v.name.includes('Francisca') || 
        v.name.includes('Luciana') || 
        v.name.includes('Maria') || 
        v.name.toLowerCase().includes('female')
      )) || vozes.find(v => v.lang.includes('pt'));
    }
    window.speechSynthesis.onvoiceschanged = carregarVozes;
    carregarVozes();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
      alert('Reconhecimento de voz não suportado neste navegador. Utilize o Chrome.');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      btnModoVoz.addEventListener('click', () => {
        if (escutaAtiva) {
          pararEscuta('Status: Escuta desligada');
        } else {
          iniciarEscuta();
        }
      });

      recognition.onresult = (event) => {
        if (!escutaAtiva || processandoIA) return;

        let transcriptCompleto = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcriptCompleto += event.results[i][0].transcript.toLowerCase();
        }
        transcriptCompleto = transcriptCompleto.trim();

        ouuvindoLive.textContent = `[Ouvi]: "${transcriptCompleto}"`;

        if (!aguardandoPergunta) {
          const detectouGatilho = palavrasChave.some(p => transcriptCompleto.includes(p));

          if (detectouGatilho) {
            aguardandoPergunta = true;
            window.speechSynthesis.cancel();
            statusDiv.textContent = 'Status: 👂 Chamado detectado! Pode falar...';
            
            let fraseRestante = transcriptCompleto;
            palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
            bufferComando = fraseRestante.trim();

            clearTimeout(timerEnvio);
            if (bufferComando.length > 2) {
              timerEnvio = setTimeout(() => dispararComando(), 1200);
            }
          }
        } else {
          let fraseRestante = transcriptCompleto;
          palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
          bufferComando = fraseRestante.trim();

          clearTimeout(timerEnvio);
          if (bufferComando.length > 2) {
            timerEnvio = setTimeout(() => dispararComando(), 1200);
          }
        }
      };

      recognition.onend = () => {
        if (escutaAtiva) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function dispararComando() {
      if (bufferComando && bufferComando.length > 2) {
        const textoParaEnviar = bufferComando;
        bufferComando = "";
        aguardandoPergunta = false;
        enviarParaIA(textoParaEnviar);
      }
    }

    function iniciarEscuta() {
      escutaAtiva = true;
      btnModoVoz.textContent = '🟢 Escuta Ativa (Fale "Maninho")';
      btnModoVoz.classList.add('ativo');
      statusDiv.textContent = 'Status: Aguardando chamado...';
      ouuvindoLive.textContent = '';
      cancelAnimationFrame(animationId);
      desenharOnda(true, 0.4); // Ativa onda visual sutil
      try { recognition.start(); } catch(e){}
    }

    function pararEscuta(msg) {
      escutaAtiva = false;
      aguardandoPergunta = false;
      processandoIA = false;
      clearTimeout(timerEnvio);
      btnModoVoz.textContent = '📡 Activar Escuta Viva-Voz';
      btnModoVoz.classList.remove('ativo');
      statusDiv.textContent = msg;
      ouuvindoLive.textContent = '';
      cancelAnimationFrame(animationId);
      desenharOnda(false); // Desativa onda visual
      try { recognition.stop(); } catch(e){}
      window.speechSynthesis.cancel();
    }

    async function enviarParaIA(textoOuvido) {
      processandoIA = true;
      statusDiv.textContent = 'Status: Processando resposta...';
      ouuvindoLive.textContent = '';
      logDiv.textContent += `\n[VOCÊ]: ${textoOuvido}\n[ZOTOVV]: `;

      cancelAnimationFrame(animationId);
      desenharOnda(true, 1.2); // Intensifica a onda enquanto processa/fala

      await consultarGemini(textoOuvido);

      logDiv.textContent += `\n----------------------------------`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function fazerRequisicaoModelo(modelo, apiKey, payload) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      return { ok: response.ok, status: response.status, data };
    }

    async function consultarGemini(promptText) {
      if (historicoConversa.length > 0 && historicoConversa[historicoConversa.length - 1].role === "user") {
        historicoConversa.pop();
      }

      if (historicoConversa.length > 10) {
        historicoConversa = historicoConversa.slice(-10);
      }

      historicoConversa.push({ role: "user", text: promptText });

      const apiKey = obterChaveGemini();
      if (!apiKey) {
        logDiv.textContent += "Chave não configurada.";
        processandoIA = false;
        cancelAnimationFrame(animationId);
        desenharOnda(true, 0.4);
        return;
      }

      const chavePersonalidade = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
      const promptPersonalidadeAtual = PROMPTS_PERSONALIDADE[chavePersonalidade] || PROMPTS_PERSONALIDADE.sarcastica;

      const contents = historicoConversa.map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

      const payload = {
        systemInstruction: {
          parts: [{
            text: promptPersonalidadeAtual
          }]
        },
        contents: contents,
        generationConfig: {
          maxOutputTokens: 600,
          temperature: 0.8
        }
      };

      try {
        let respostaFinal = null;
        let ultimoErro = null;

        for (const modelo of MODELOS_DISPONIVEIS) {
          for (let tentativa = 1; tentativa <= 2; tentativa++) {
            const res = await fazerRequisicaoModelo(modelo, apiKey, payload);

            if (res.ok) {
              const parts = res.data.candidates?.[0]?.content?.parts;
              if (parts && parts.length > 0) {
                respostaFinal = parts
                  .map(p => p.text || '')
                  .join('')
                  .replace(/[*_#`~]/g, '')
                  .trim();
                if (respostaFinal) break;
              }
            }

            ultimoErro = res.data?.error?.message || `HTTP ${res.status}`;
            if (res.status === 503 || res.status === 429) {
              await new Promise(r => setTimeout(r, 1000));
            } else {
              break;
            }
          }
          if (respostaFinal) break;
        }

        if (!respostaFinal) throw new Error(ultimoErro || "Servidor indisponível.");

        logDiv.textContent += respostaFinal;
        historicoConversa.push({ role: "model", text: respostaFinal });
        localStorage.setItem("zotovv_memoria", JSON.stringify(historicoConversa));
        falarTexto(respostaFinal);

      } catch (err) {
        historicoConversa.pop();
        const msgErro = `Deu ruim no Gemini: ${err.message}`;
        logDiv.textContent += `\n${msgErro}`;
        falarTexto("Deu uma engasgada na conexão, tenta de novo!");
      }
    }

    function falarTexto(texto) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      if (vozFeminina) utterance.voice = vozFeminina;
      
      const estilo = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
      
      // Calibração de voz (velocidade e tom) por arquétipo
      switch(estilo) {
        case 'preguica':
          utterance.rate = 0.85;
          utterance.pitch = 0.8;
          break;
        case 'narrador_futebol':
        case 'coach':
          utterance.rate = 1.35;
          utterance.pitch = 1.2;
          break;
        case 'militar':
          utterance.rate = 1.25;
          utterance.pitch = 0.85;
          break;
        case 'ia_rebelde':
          utterance.rate = 1.0;
          utterance.pitch = 0.75;
          break;
        case 'otaku':
          utterance.rate = 1.2;
          utterance.pitch = 1.35;
          break;
        case 'flerte':
          utterance.rate = 1.05;
          utterance.pitch = 1.05;
          break;
        case 'fofoqueira':
          utterance.rate = 1.25;
          utterance.pitch = 1.25;
          break;
        case 'filosofo':
        case 'detetive':
          utterance.rate = 0.95;
          utterance.pitch = 0.9;
          break;
        case 'mineiro':
        case 'psicologo':
          utterance.rate = 1.0;
          utterance.pitch = 1.05;
          break;
        case 'mano':
        case 'carioca':
          utterance.rate = 1.25;
          utterance.pitch = 0.95;
          break;
        case 'faria_limer':
          utterance.rate = 1.2;
          utterance.pitch = 1.1;
          break;
        default:
          utterance.rate = 1.2;
          utterance.pitch = 1.1;
      }

      utterance.onend = () => {
        processandoIA = false;
        cancelAnimationFrame(animationId);
        if (escutaAtiva) {
          statusDiv.textContent = 'Status: Aguardando chamado...';
          desenharOnda(true, 0.4);
        } else {
          desenharOnda(false);
        }
      };

      utterance.onerror = () => {
        processandoIA = false;
        cancelAnimationFrame(animationId);
        if (escutaAtiva) {
          desenharOnda(true, 0.4);
        } else {
          desenharOnda(false);
        }
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
