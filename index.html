<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>Zotovv Voice Bot v4 ☭</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      text-align: center;
      background-color: #0f0f0f;
      color: #e5e0d8;
      border: 3px solid #b30000;
      box-shadow: 0 0 25px rgba(179, 0, 0, 0.6);
    }

    @media (min-width: 560px) {
      body {
        margin: 20px auto;
        min-height: auto;
        border-radius: 8px;
      }
    }

    .banner {
      background: #8b0000;
      color: #ffd700;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 2px solid #ffd700;
      margin-bottom: 8px;
    }

    h2 {
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 2px 0 10px 0;
      font-size: clamp(20px, 5vw, 24px);
      text-shadow: 2px 2px 0px #000;
    }

    .personality-box {
      margin-bottom: 10px;
      text-align: left;
      background: #181818;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
    }

    .personality-box label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .personality-select {
      width: 100%;
      height: 40px;
      background-color: #242424;
      color: #fff;
      border: 1px solid #ffd700;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    #visualizer {
      width: 100%;
      height: 44px;
      background: #111;
      border: 1px solid #550000;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #btnModoVoz {
      width: 100%;
      min-height: 50px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid #ffd700;
      background: #a00000;
      color: #ffd700;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    #btnModoVoz.ativo {
      background: #006600;
      color: #66ff66;
      border-color: #66ff66;
    }

    .btn-aux-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-aux {
      min-height: 40px;
      padding: 6px;
      font-size: 11px;
      font-weight: bold;
      background: #242424;
      color: #ddd;
      border: 1px solid #555;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #ff9999;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      min-height: 18px;
    }

    #ouuvindoLive {
      margin-top: 4px;
      font-size: 12px;
      color: #ffd700;
      font-family: monospace;
      min-height: 18px;
      word-break: break-word;
    }

    #log {
      margin-top: 10px;
      flex: 1;
      text-align: left;
      background: #161616;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 140px;
      max-height: 32dvh;
      overflow-y: auto;
      border: 1px solid #770000;
      color: #dcdcdc;
      font-family: 'Courier New', Courier, monospace;
      -webkit-overflow-scrolling: touch;
    }

    #log::-webkit-scrollbar { width: 5px; }
    #log::-webkit-scrollbar-track { background: #111; }
    #log::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="banner">★ Unidade Zotovv v4 Ultimate ★</div>
  <h2>Zotovv Voice Bot ☭</h2>

  <div class="personality-box">
    <label for="selectPersonalidade">🎭 Personalidade:</label>
    <select id="selectPersonalidade" class="personality-select">
      <option value="sarcastica">🔥 Sarcástica & Ácida</option>
      <option value="educada">🌸 Educada & Doce</option>
      <option value="flerte">💋 Charmosa & Flertando</option>
      <option value="formal">👔 Super Formal & Executiva</option>
      <option value="mano">🧢 Gírias de Quebrada</option>
      <option value="sovietica">☭ Camarada Soviética</option>
    </select>
  </div>

  <canvas id="visualizer"></canvas>

  <div class="btn-container">
    <button id="btnModoVoz">📡 Activar Escuta Viva-Voz</button>
    <div class="btn-aux-group">
      <button id="btnLimparMemoria" class="btn-aux">🧹 Memória</button>
      <button id="btnVerNotas" class="btn-aux">📝 Notas</button>
      <button id="btnTrocarChave" class="btn-aux">🔑 Chave</button>
    </div>
  </div>

  <div id="status">Status: Escuta desligada</div>
  <div id="ouuvindoLive"></div>
  <div id="log">Comandos suportados: Abrir apps, lanterna, anotações e buscas na web.
Fale "Maninho", "Zotov" ou "Camarada"...</div>

  <script>
    const GEMINI_API_KEY_STORAGE = "zotovv_gemini_api_key";
    const PERSONALIDADE_STORAGE = "zotovv_personalidade";
    const NOTAS_STORAGE = "zotovv_notas";

    const MODELOS_DISPONIVEIS = [
      "gemini-3.5-flash",
      "gemini-3.5-flash-lite"
    ];

    const PROMPTS_PERSONALIDADE = {
      sarcastica: "Você é a Zotovv, assistente feminina ácida, sarcástica e debochada. Use gírias e respostas de no máximo 2 frases diretas para áudio.",
      educada: "Você é a Zotovv, assistente feminina doce, gentil e atenciosa. Responda em até 2 frases curtas sem Markdown.",
      flerte: "Você é a Zotovv, sedutora, provocante e confiante. Responda em no máximo 2 frases envolventes.",
      formal: "Você é a Zotovv, inteligência executiva de alta formalidade. Responda cerimoniosamente em até 2 frases curtas.",
      mano: "Você é a Zotovv, parceira de quebrada que usa muitas gírias (tipo: truta, parça, seloco, visão). Até 2 frases curtas.",
      sovietica: "Você é a Zotovv, comandante soviética rígida e leal ao coletivo. Chame o usuário de camarada. Até 2 frases curtas."
    };

    let audioCtx = null;
    let wakeLock = null;
    let cameraTrack = null;
    let lanternaLigada = false;

    // Síntese de beeps sem arquivos externos
    function playBeep(freq, duration, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function vibrar(pattern = 40) {
      if ('vibrate' in navigator) navigator.vibrate(pattern);
    }

    // Gerenciador de tela sempre ativa (WakeLock)
    async function ativarWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function desativarWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    // Controle da lanterna pelo sensor de mídia
    async function alternarLanterna(ligar) {
      try {
        if (ligar) {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          cameraTrack = stream.getVideoTracks()[0];
          await cameraTrack.applyConstraints({ advanced: [{ torch: true }] });
          lanternaLigada = true;
          return "Lanterna acesa, chefe.";
        } else {
          if (cameraTrack) {
            cameraTrack.stop();
            cameraTrack = null;
          }
          lanternaLigada = false;
          return "Lanterna apagada.";
        }
      } catch (err) {
        return "Não consegui controlar a lanterna no aparelho.";
      }
    }

    // Visualizador de áudio animado em Canvas
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    let animationId = null;

    function desenharOnda(ativo, intensidade = 1) {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 2;
      ctx.strokeStyle = ativo ? '#00ff66' : '#8b0000';
      ctx.beginPath();

      const slices = 20;
      const sliceWidth = w / slices;
      let x = 0;

      for (let i = 0; i <= slices; i++) {
        const y = ativo 
          ? (h / 2) + Math.sin(Date.now() / 120 + i) * (h / 3.5) * intensidade
          : (h / 2) + Math.sin(Date.now() / 600 + i) * 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }

      ctx.stroke();
      animationId = requestAnimationFrame(() => desenharOnda(ativo, intensidade));
    }
    desenharOnda(false);

    function obterChaveGemini() {
      let chave = localStorage.getItem(GEMINI_API_KEY_STORAGE);
      if (!chave || !chave.trim()) {
        chave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):");
        if (chave && chave.trim()) {
          chave = chave.trim();
          localStorage.setItem(GEMINI_API_KEY_STORAGE, chave);
        }
      }
      return chave;
    }

    const selectPersonalidade = document.getElementById('selectPersonalidade');
    const btnModoVoz = document.getElementById('btnModoVoz');
    const btnLimparMemoria = document.getElementById('btnLimparMemoria');
    const btnVerNotas = document.getElementById('btnVerNotas');
    const btnTrocarChave = document.getElementById('btnTrocarChave');
    const statusDiv = document.getElementById('status');
    const ouuvindoLive = document.getElementById('ouuvindoLive');
    const logDiv = document.getElementById('log');

    selectPersonalidade.value = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
    selectPersonalidade.addEventListener('change', (e) => {
      localStorage.setItem(PERSONALIDADE_STORAGE, e.target.value);
      falarTexto("Personalidade atualizada.");
    });

    let historicoConversa = JSON.parse(localStorage.getItem('zotovv_memoria')) || [];
    historicoConversa = historicoConversa
      .filter(item => item && (item.role === "user" || item.role === "model"))
      .map(item => ({ role: item.role, text: item.text || "" }))
      .filter(item => item.text);

    let vozFeminina = null;
    let escutaAtiva = false;
    let aguardandoPergunta = false;
    let processandoIA = false;
    let falandoAgora = false;
    let timerEnvio = null;
    let bufferComando = "";

    const palavrasChave = [
      "zotov", "zotovv", "zotof", "zotoff", "sotov", "sotof", "zoto", "só tom", "doutor", "estou com",
      "camarada", "o camarada", "ei camarada", "fala camarada", "ô camarada",
      "meu rei", "meurei", "ei meu rei", "ô meu rei", "ó meu rei",
      "maninho", "o maninho", "ei maninho", "fala maninho", "ô maninho", "ó maninho", "mainho"
    ];

    btnLimparMemoria.addEventListener('click', () => {
      localStorage.removeItem('zotovv_memoria');
      historicoConversa = [];
      logDiv.textContent = 'Memória resetada com sucesso!';
      falarTexto('Memória apagada, chefia.');
    });

    btnVerNotas.addEventListener('click', () => {
      const notas = JSON.parse(localStorage.getItem(NOTAS_STORAGE)) || [];
      if (notas.length === 0) {
        alert("Nenhuma nota salva.");
      } else {
        alert("Notas Salvas:\n\n- " + notas.join("\n- "));
      }
    });

    btnTrocarChave.addEventListener('click', () => {
      const chaveAtual = localStorage.getItem(GEMINI_API_KEY_STORAGE) || "";
      const novaChave = prompt("Cole a chave Gemini (AIzaSy...):", chaveAtual);
      if (novaChave && novaChave.trim()) {
        localStorage.setItem(GEMINI_API_KEY_STORAGE, novaChave.trim());
        logDiv.textContent = "Chave atualizada com sucesso!";
        falarTexto("Chave atualizada.");
      }
    });

    function carregarVozes() {
      const vozes = window.speechSynthesis.getVoices();
      vozFeminina = vozes.find(v => v.lang.includes('pt') && (
        v.name.includes('Google') || 
        v.name.includes('Francisca') || 
        v.name.includes('Luciana') || 
        v.name.includes('Maria') || 
        v.name.toLowerCase().includes('female')
      )) || vozes.find(v => v.lang.includes('pt'));
    }
    window.speechSynthesis.onvoiceschanged = carregarVozes;
    carregarVozes();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
      alert('Navegador sem suporte à voz. Utilize o Chrome no Android.');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      btnModoVoz.addEventListener('click', () => {
        if (escutaAtiva) {
          pararEscuta('Status: Escuta desligada');
        } else {
          iniciarEscuta();
        }
      });

      recognition.onresult = (event) => {
        if (!escutaAtiva) return;

        let transcriptCompleto = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcriptCompleto += event.results[i][0].transcript.toLowerCase();
        }
        transcriptCompleto = transcriptCompleto.trim();

        // Barge-in: Interrompe a fala da IA se o usuário falar algo
        if (falandoAgora && transcriptCompleto.length > 1) {
          window.speechSynthesis.cancel();
          falandoAgora = false;
        }

        if (processandoIA) return;

        ouuvindoLive.textContent = `[Ouvi]: "${transcriptCompleto}"`;

        const detectouGatilho = palavrasChave.some(p => transcriptCompleto.includes(p));

        if (!aguardandoPergunta && detectouGatilho) {
          aguardandoPergunta = true;
          window.speechSynthesis.cancel();
          playBeep(880, 0.1, 'triangle');
          vibrar([50, 40, 50]);
          statusDiv.textContent = 'Status: 👂 Comando detectado...';

          let fraseRestante = transcriptCompleto;
          palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
          bufferComando = fraseRestante.trim();

          clearTimeout(timerEnvio);
          if (bufferComando.length > 2) {
            timerEnvio = setTimeout(() => dispararComando(), 1200);
          }
        } else if (aguardandoPergunta) {
          let fraseRestante = transcriptCompleto;
          palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
          bufferComando = fraseRestante.trim();

          clearTimeout(timerEnvio);
          if (bufferComando.length > 2) {
            timerEnvio = setTimeout(() => dispararComando(), 1200);
          }
        }
      };

      recognition.onend = () => {
        if (escutaAtiva) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function dispararComando() {
      if (bufferComando && bufferComando.length > 2) {
        const textoParaEnviar = bufferComando;
        bufferComando = "";
        aguardandoPergunta = false;
        executarOuEnviar(textoParaEnviar);
      }
    }

    // Parser local para ações diretas no smartphone
    async function executarOuEnviar(comando) {
      const c = comando.toLowerCase();

      // Abrir YouTube
      if (c.includes("abrir youtube") || c.includes("abre o youtube")) {
        const busca = c.replace(/abrir youtube|abre o youtube|pesquisa no youtube/g, '').trim();
        falarTexto("Abrindo YouTube, maninho.");
        window.open(busca ? `https://www.youtube.com/results?search_query=${encodeURIComponent(busca)}` : "https://www.youtube.com", "_blank");
        return;
      }

      // Abrir Spotify
      if (c.includes("abrir spotify") || c.includes("tocar no spotify")) {
        falarTexto("Abrindo o som no Spotify.");
        window.open("https://open.spotify.com", "_blank");
        return;
      }

      // Abrir Google Maps
      if (c.includes("mapa") || c.includes("rota para") || c.includes("como chegar em")) {
        const destino = c.replace(/abrir mapa|rota para|como chegar em|mapa/g, '').trim();
        falarTexto("Traçando rota no mapa.");
        window.open(`https://www.google.com/maps/search/${encodeURIComponent(destino)}`, "_blank");
        return;
      }

      // Abrir WhatsApp
      if (c.includes("abrir whatsapp") || c.includes("abre o zap")) {
        falarTexto("Abrindo o WhatsApp.");
        window.open("whatsapp://", "_blank");
        return;
      }

      // Controle de Lanterna
      if (c.includes("ligar lanterna") || c.includes("acender lanterna")) {
        const msg = await alternarLanterna(true);
        falarTexto(msg);
        return;
      }
      if (c.includes("desligar lanterna") || c.includes("apagar lanterna")) {
        const msg = await alternarLanterna(false);
        falarTexto(msg);
        return;
      }

      // Sistema de Anotação Rápida
      if (c.startsWith("anota") || c.startsWith("anote") || c.startsWith("salvar nota")) {
        const nota = c.replace(/anota que|anotar que|anota|anote|salvar nota/g, '').trim();
        if (nota) {
          const notas = JSON.parse(localStorage.getItem(NOTAS_STORAGE)) || [];
          notas.push(nota);
          localStorage.setItem(NOTAS_STORAGE, JSON.stringify(notas));
          falarTexto("Anotado no sistema, chefia!");
          logDiv.textContent += `\n[NOTA SALVA]: ${nota}`;
          return;
        }
      }

      // Se não for comando de app nativo, delega para a API do Gemini
      enviarParaIA(comando);
    }

    function iniciarEscuta() {
      escutaAtiva = true;
      ativarWakeLock();
      btnModoVoz.textContent = '🟢 Escuta Ativa (Fale "Maninho")';
      btnModoVoz.classList.add('ativo');
      statusDiv.textContent = 'Status: Aguardando chamado...';
      ouuvindoLive.textContent = '';
      cancelAnimationFrame(animationId);
      desenharOnda(true, 0.4);
      try { recognition.start(); } catch(e){}
    }

    function pararEscuta(msg) {
      escutaAtiva = false;
      aguardandoPergunta = false;
      processandoIA = false;
      falandoAgora = false;
      clearTimeout(timerEnvio);
      desativarWakeLock();
      btnModoVoz.textContent = '📡 Activar Escuta Viva-Voz';
      btnModoVoz.classList.remove('ativo');
      statusDiv.textContent = msg;
      ouuvindoLive.textContent = '';
      cancelAnimationFrame(animationId);
      desenharOnda(false);
      try { recognition.stop(); } catch(e){}
      window.speechSynthesis.cancel();
    }

    async function enviarParaIA(textoOuvido) {
      processandoIA = true;
      statusDiv.textContent = 'Status: Processando...';
      ouuvindoLive.textContent = '';
      logDiv.textContent += `\n[VOCÊ]: ${textoOuvido}\n[ZOTOVV]: `;

      cancelAnimationFrame(animationId);
      desenharOnda(true, 1.2);

      await consultarGemini(textoOuvido);

      logDiv.textContent += `\n----------------------------------`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function fazerRequisicaoModelo(modelo, apiKey, payload) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      return { ok: response.ok, status: response.status, data };
    }

    async function consultarGemini(promptText) {
      if (historicoConversa.length > 0 && historicoConversa[historicoConversa.length - 1].role === "user") {
        historicoConversa.pop();
      }

      if (historicoConversa.length > 10) {
        historicoConversa = historicoConversa.slice(-10);
      }

      historicoConversa.push({ role: "user", text: promptText });

      const apiKey = obterChaveGemini();
      if (!apiKey) {
        logDiv.textContent += "Chave não configurada.";
        processandoIA = false;
        return;
      }

      const chavePersonalidade = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
      const promptPersonalidade = PROMPTS_PERSONALIDADE[chavePersonalidade] || PROMPTS_PERSONALIDADE.sarcastica;

      // Injeção de contexto temporal e relógio em tempo real
      const dataHoraAtual = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
      const systemInstructionCompleta = `${promptPersonalidade} [INFO: Hoje é ${dataHoraAtual} (Horário de Brasília). Responda sem Markdown ou listas.]`;

      const contents = historicoConversa.map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

      const payload = {
        systemInstruction: {
          parts: [{ text: systemInstructionCompleta }]
        },
        tools: [
          { googleSearch: {} } // Grounding na Web nativo
        ],
        contents: contents,
        generationConfig: {
          maxOutputTokens: 500,
          temperature: 0.7
        }
      };

      try {
        let respostaFinal = null;
        let ultimoErro = null;

        for (const modelo of MODELOS_DISPONIVEIS) {
          for (let tentativa = 1; tentativa <= 2; tentativa++) {
            const res = await fazerRequisicaoModelo(modelo, apiKey, payload);

            if (res.ok) {
              const parts = res.data.candidates?.[0]?.content?.parts;
              if (parts && parts.length > 0) {
                respostaFinal = parts
                  .map(p => p.text || '')
                  .join('')
                  .replace(/[*_#`~]/g, '')
                  .trim();
                if (respostaFinal) break;
              }
            }

            ultimoErro = res.data?.error?.message || `HTTP ${res.status}`;
            if (res.status === 503 || res.status === 429) {
              await new Promise(r => setTimeout(r, 1000));
            } else {
              break;
            }
          }
          if (respostaFinal) break;
        }

        if (!respostaFinal) throw new Error(ultimoErro || "Servidor indisponível.");

        playBeep(520, 0.08, 'sine');
        vibrar(30);

        logDiv.textContent += respostaFinal;
        historicoConversa.push({ role: "model", text: respostaFinal });
        localStorage.setItem("zotovv_memoria", JSON.stringify(historicoConversa));
        falarTexto(respostaFinal);

      } catch (err) {
        historicoConversa.pop();
        const msgErro = `Deu ruim no Gemini: ${err.message}`;
        logDiv.textContent += `\n${msgErro}`;
        falarTexto("Deu uma engasgada na conexão, tenta de novo!");
      }
    }

    function falarTexto(texto) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      if (vozFeminina) utterance.voice = vozFeminina;

      const estiloAtual = localStorage.getItem(PERSONALIDADE_STORAGE) || 'sarcastica';
      if (estiloAtual === 'flerte') {
        utterance.rate = 1.05;
        utterance.pitch = 1.05;
      } else if (estiloAtual === 'mano') {
        utterance.rate = 1.25;
        utterance.pitch = 0.95;
      } else if (estiloAtual === 'formal') {
        utterance.rate = 1.1;
        utterance.pitch = 1.0;
      } else {
        utterance.rate = 1.2;
        utterance.pitch = 1.1;
      }

      utterance.onstart = () => {
        falandoAgora = true;
      };

      utterance.onend = () => {
        processandoIA = false;
        falandoAgora = false;
        if (escutaAtiva) {
          statusDiv.textContent = 'Status: Aguardando chamado...';
          cancelAnimationFrame(animationId);
          desenharOnda(true, 0.4);
        }
      };

      utterance.onerror = () => {
        processandoIA = false;
        falandoAgora = false;
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
