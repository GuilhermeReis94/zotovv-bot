<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>Zotovv Voice Bot v3 ☭</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      text-align: center;
      background-color: #0f0f0f;
      color: #e5e0d8;
      border: 3px solid #b30000;
      box-shadow: 0 0 20px rgba(179, 0, 0, 0.5);
    }

    @media (min-width: 560px) {
      body {
        margin: 24px auto;
        min-height: auto;
        border-radius: 6px;
      }
    }

    .banner {
      background: #8b0000;
      color: #ffd700;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 2px solid #ffd700;
      margin-bottom: 12px;
    }

    h2 {
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 4px 0 16px 0;
      font-size: clamp(20px, 5vw, 24px);
      text-shadow: 2px 2px 0px #000;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #btnModoVoz {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid #ffd700;
      background: #a00000;
      color: #ffd700;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    #btnModoVoz.ativo {
      background: #006600;
      color: #66ff66;
      border-color: #66ff66;
    }

    .btn-aux-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-aux {
      min-height: 44px;
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      background: #242424;
      color: #ddd;
      border: 1px solid #555;
    }

    #status {
      margin-top: 16px;
      font-size: 12px;
      color: #ff9999;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      min-height: 18px;
    }

    #ouuvindoLive {
      margin-top: 6px;
      font-size: 12px;
      color: #ffd700;
      font-family: monospace;
      min-height: 18px;
      word-break: break-word;
    }

    #log {
      margin-top: 14px;
      flex: 1;
      text-align: left;
      background: #161616;
      padding: 12px 14px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 160px;
      max-height: 40dvh;
      overflow-y: auto;
      border: 1px solid #770000;
      color: #dcdcdc;
      font-family: 'Courier New', Courier, monospace;
      -webkit-overflow-scrolling: touch;
    }

    #log::-webkit-scrollbar { width: 5px; }
    #log::-webkit-scrollbar-track { background: #111; }
    #log::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="banner">★ Unidade de Inteligência de Voz v3 ★</div>
  <h2>Zotovv Voice Bot ☭</h2>

  <div class="btn-container">
    <button id="btnModoVoz">📡 Activar Escuta Viva-Voz</button>
    <div class="btn-aux-group">
      <button id="btnLimparMemoria" class="btn-aux">🧹 Limpar Memória</button>
      <button id="btnTrocarChave" class="btn-aux">🔑 Trocar Chave</button>
    </div>
  </div>

  <div id="status">Status: Escuta desligada</div>
  <div id="ouuvindoLive"></div>
  <div id="log">Fale "Zotov", "Camarada", "Maninho" ou "Meu rei" para acionar a Zotovv...</div>

  <script>
    const GEMINI_API_KEY_STORAGE = "zotovv_gemini_api_key";
    
    const MODELOS_DISPONIVEIS = [
      "gemini-3.5-flash",
      "gemini-3.5-flash-lite"
    ];

    function obterChaveGemini() {
      let chave = localStorage.getItem(GEMINI_API_KEY_STORAGE);
      if (!chave || !chave.trim()) {
        chave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):");
        if (chave && chave.trim()) {
          chave = chave.trim();
          localStorage.setItem(GEMINI_API_KEY_STORAGE, chave);
        }
      }
      return chave;
    }

    const btnModoVoz = document.getElementById('btnModoVoz');
    const btnLimparMemoria = document.getElementById('btnLimparMemoria');
    const btnTrocarChave = document.getElementById('btnTrocarChave');
    const statusDiv = document.getElementById('status');
    const ouuvindoLive = document.getElementById('ouuvindoLive');
    const logDiv = document.getElementById('log');

    let historicoConversa = JSON.parse(localStorage.getItem('zotovv_memoria')) || [];
    historicoConversa = historicoConversa
      .filter(item => item && (item.role === "user" || item.role === "model"))
      .map(item => ({ role: item.role, text: item.text || "" }))
      .filter(item => item.text);

    let vozFeminina = null;
    let escutaAtiva = false;
    let aguardandoPergunta = false;
    let processandoIA = false;
    let timerEnvio = null;
    let bufferComando = "";

    const palavrasChave = [
      "zotov", "zotovv", "zotof", "zotoff", "sotov", "sotof", "zoto", "só tom", "doutor", "estou com",
      "camarada", "o camarada", "ei camarada", "fala camarada", "ô camarada",
      "meu rei", "meurei", "ei meu rei", "ô meu rei", "ó meu rei",
      "maninho", "o maninho", "ei maninho", "fala maninho", "ô maninho", "ó maninho", "mainho"
    ];

    btnLimparMemoria.addEventListener('click', () => {
      localStorage.removeItem('zotovv_memoria');
      historicoConversa = [];
      logDiv.textContent = 'Memória resetada com sucesso!';
      falarTexto('Memória apagada, maninho.');
    });

    btnTrocarChave.addEventListener('click', () => {
      const chaveAtual = localStorage.getItem(GEMINI_API_KEY_STORAGE) || "";
      const novaChave = prompt("Cole sua chave Gemini (iniciada em AIzaSy...):", chaveAtual);
      if (novaChave && novaChave.trim()) {
        localStorage.setItem(GEMINI_API_KEY_STORAGE, novaChave.trim());
        logDiv.textContent = "Chave atualizada com sucesso!";
        falarTexto("Chave atualizada, maninho.");
      }
    });

    function carregarVozes() {
      const vozes = window.speechSynthesis.getVoices();
      vozFeminina = vozes.find(v => v.lang.includes('pt') && (
        v.name.includes('Google') || 
        v.name.includes('Francisca') || 
        v.name.includes('Luciana') || 
        v.name.includes('Maria') || 
        v.name.toLowerCase().includes('female')
      )) || vozes.find(v => v.lang.includes('pt'));
    }
    window.speechSynthesis.onvoiceschanged = carregarVozes;
    carregarVozes();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
      alert('Reconhecimento de voz não suportado neste navegador. Use o Chrome.');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      btnModoVoz.addEventListener('click', () => {
        if (escutaAtiva) {
          pararEscuta('Status: Escuta desligada');
        } else {
          iniciarEscuta();
        }
      });

      recognition.onresult = (event) => {
        if (!escutaAtiva || processandoIA) return;

        let transcriptCompleto = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcriptCompleto += event.results[i][0].transcript.toLowerCase();
        }
        transcriptCompleto = transcriptCompleto.trim();

        ouuvindoLive.textContent = `[Ouvi]: "${transcriptCompleto}"`;

        if (!aguardandoPergunta) {
          const detectouGatilho = palavrasChave.some(p => transcriptCompleto.includes(p));

          if (detectouGatilho) {
            aguardandoPergunta = true;
            window.speechSynthesis.cancel();
            statusDiv.textContent = 'Status: 👂 Chamado detectado! Pode falar...';
            
            // Remove o gatilho inicial para isolar o que foi dito junto
            let fraseRestante = transcriptCompleto;
            palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
            bufferComando = fraseRestante.trim();

            // Aguarda 1,2s de silêncio para dar tempo de terminar a frase no celular
            clearTimeout(timerEnvio);
            if (bufferComando.length > 2) {
              timerEnvio = setTimeout(() => dispararComando(), 1200);
            }
          }
        } else {
          // Se já está ouvindo o comando, acumula o texto falado
          let fraseRestante = transcriptCompleto;
          palavrasChave.forEach(p => { fraseRestante = fraseRestante.replace(p, ''); });
          bufferComando = fraseRestante.trim();

          clearTimeout(timerEnvio);
          if (bufferComando.length > 2) {
            timerEnvio = setTimeout(() => dispararComando(), 1200);
          }
        }
      };

      recognition.onend = () => {
        if (escutaAtiva) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function dispararComando() {
      if (bufferComando && bufferComando.length > 2) {
        const textoParaEnviar = bufferComando;
        bufferComando = "";
        aguardandoPergunta = false;
        enviarParaIA(textoParaEnviar);
      }
    }

    function iniciarEscuta() {
      escutaAtiva = true;
      btnModoVoz.textContent = '🟢 Escuta Ativa (Fale "Maninho")';
      btnModoVoz.classList.add('ativo');
      statusDiv.textContent = 'Status: Aguardando chamado...';
      ouuvindoLive.textContent = '';
      try { recognition.start(); } catch(e){}
    }

    function pararEscuta(msg) {
      escutaAtiva = false;
      aguardandoPergunta = false;
      processandoIA = false;
      clearTimeout(timerEnvio);
      btnModoVoz.textContent = '📡 Activar Escuta Viva-Voz';
      btnModoVoz.classList.remove('ativo');
      statusDiv.textContent = msg;
      ouuvindoLive.textContent = '';
      try { recognition.stop(); } catch(e){}
      window.speechSynthesis.cancel();
    }

    async function enviarParaIA(textoOuvido) {
      processandoIA = true;
      statusDiv.textContent = 'Status: Processando resposta...';
      ouuvindoLive.textContent = '';
      logDiv.textContent += `\n[VOCÊ]: ${textoOuvido}\n[ZOTOVV]: `;

      await consultarGemini(textoOuvido);

      logDiv.textContent += `\n----------------------------------`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function fazerRequisicaoModelo(modelo, apiKey, payload) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      return { ok: response.ok, status: response.status, data };
    }

    async function consultarGemini(promptText) {
      if (historicoConversa.length > 0 && historicoConversa[historicoConversa.length - 1].role === "user") {
        historicoConversa.pop();
      }

      if (historicoConversa.length > 10) {
        historicoConversa = historicoConversa.slice(-10);
      }

      historicoConversa.push({ role: "user", text: promptText });

      const apiKey = obterChaveGemini();
      if (!apiKey) {
        logDiv.textContent += "Chave não configurada.";
        processandoIA = false;
        return;
      }

      const contents = historicoConversa.map(item => ({
        role: item.role,
        parts: [{ text: item.text }]
      }));

      const payload = {
        systemInstruction: {
          parts: [{
            text: "Você é a Zotovv, assistente virtual feminina debochada, ácida, sarcástica e direta. Fale em português coloquial com gírias brasileiras. Dê respostas de 1 a 2 frases curtas sem listas, sem opções e sem formatação Markdown, direto ao ponto para ser lido em voz alta."
          }]
        },
        contents: contents,
        generationConfig: {
          maxOutputTokens: 600,
          temperature: 0.8
        }
      };

      try {
        let respostaFinal = null;
        let ultimoErro = null;

        for (const modelo of MODELOS_DISPONIVEIS) {
          for (let tentativa = 1; tentativa <= 2; tentativa++) {
            const res = await fazerRequisicaoModelo(modelo, apiKey, payload);

            if (res.ok) {
              const parts = res.data.candidates?.[0]?.content?.parts;
              if (parts && parts.length > 0) {
                respostaFinal = parts
                  .map(p => p.text || '')
                  .join('')
                  .replace(/[*_#`~]/g, '')
                  .trim();
                if (respostaFinal) break;
              }
            }

            ultimoErro = res.data?.error?.message || `HTTP ${res.status}`;
            if (res.status === 503 || res.status === 429) {
              await new Promise(r => setTimeout(r, 1000));
            } else {
              break;
            }
          }
          if (respostaFinal) break;
        }

        if (!respostaFinal) throw new Error(ultimoErro || "Servidor indisponível.");

        logDiv.textContent += respostaFinal;
        historicoConversa.push({ role: "model", text: respostaFinal });
        localStorage.setItem("zotovv_memoria", JSON.stringify(historicoConversa));
        falarTexto(respostaFinal);

      } catch (err) {
        historicoConversa.pop();
        const msgErro = `Deu ruim no Gemini, maninho: ${err.message}`;
        logDiv.textContent += `\n${msgErro}`;
        falarTexto("Deu uma engasgada na conexão, tenta de novo!");
      }
    }

    function falarTexto(texto) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'pt-BR';
      if (vozFeminina) utterance.voice = vozFeminina;
      utterance.rate = 1.2;
      utterance.pitch = 1.1;

      utterance.onend = () => {
        processandoIA = false;
        if (escutaAtiva) {
          statusDiv.textContent = 'Status: Aguardando chamado...';
        }
      };

      utterance.onerror = () => {
        processandoIA = false;
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
